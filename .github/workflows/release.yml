name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Attestation only. id-token mints the short-lived OIDC token that
      # proves the build ran here; attestations writes the resulting record.
      # Neither belongs on the release job, which already holds the write
      # token that publishes.
      id-token: write
      attestations: write
    strategy:
      matrix:
        # Mirrors the OS coverage ci.yml tests on. Windows was tested there
        # but never shipped here, so a platform was being validated every
        # push and then withheld from every release.
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Rethunk-Tech/gh-actions/setup-go@4c3240b9077c81a6f03f499dafaec6494220aad5 # v1.27

      # Pure Go, no cgo — every target cross-compiles from one ubuntu
      # runner instead of needing native macOS/Windows builders.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="format-dispatch-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -o "$out" ./cmd/format-dispatch
          sha256sum "$out" > "$out.sha256"

      # The .sha256 ships in the same release as the binary, so it proves
      # transit only -- whoever can replace one can replace both. This
      # records that these exact bytes came out of this workflow at this
      # commit, checkable after download with
      # `gh attestation verify <file> --repo <owner>/<repo>`. It runs in the
      # job that built them, before anything is uploaded, so no artifact
      # reaches a release unattested. The subject is the binary alone: the
      # sidecar checksum is not a shipped executable and a glob here would
      # attest it as one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: format-dispatch-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      # Completions and the man page are generated from this binary's own
      # command table, so they cannot drift from --help. Arch-independent:
      # only one matrix leg stages the tarball, or the merged artifacts collide.
      - name: Stage completions and the man page
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          bin="./format-dispatch-linux-amd64"
          assets=$(mktemp -d)
          "$bin" completion bash > "$assets/format-dispatch.bash"
          "$bin" completion zsh > "$assets/_format-dispatch"
          "$bin" completion fish > "$assets/format-dispatch.fish"
          "$bin" completion powershell > "$assets/format-dispatch.ps1"
          "$bin" man > "$assets/format-dispatch.1"
          for f in format-dispatch.bash _format-dispatch format-dispatch.fish format-dispatch.ps1 format-dispatch.1; do
            test -s "$assets/$f" || { echo "missing generated asset: $f"; exit 1; }
          done
          tar -czf format-dispatch-completions-man.tar.gz -C "$assets" \
            format-dispatch.bash _format-dispatch format-dispatch.fish \
            format-dispatch.ps1 format-dispatch.1
          sha256sum format-dispatch-completions-man.tar.gz > format-dispatch-completions-man.tar.gz.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: format-dispatch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            format-dispatch-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            format-dispatch-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        with:
          name: format-dispatch-completions-man
          path: |
            format-dispatch-completions-man.tar.gz
            format-dispatch-completions-man.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .

      # Detached signature over SHA256SUMS; the Homebrew tap and Scoop bucket verify it against the pinned
      # fingerprint (see SECURITY.md).
      - name: Sign SHA256SUMS
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$RELEASE_GPG_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          gpg --batch --yes --local-user "$fpr" --armor --detach-sign -o dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS

      # gh (preinstalled on GitHub-hosted runners) over a third-party
      # release action, consistent with this project's own bias toward
      # invoking the real tool directly rather than trusting another
      # action to wrap it.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes
