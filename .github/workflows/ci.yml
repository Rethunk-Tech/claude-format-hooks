name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # golangci-lint and govulncheck are OS-independent static analysis --
    # they run once, in the lint job below, instead of once per matrix leg.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ !cancelled() }}

      # The lint job on ubuntu gets the default go.mod-only cache key. Sharing
      # it let whichever job finished first save the Linux build cache, and
      # lint usually wins, so this leg restored a cache with no -race build
      # in it. Hashing go.sum as well gives the test legs their own key.
      - uses: Rethunk-Tech/gh-actions/setup-go@79cf1f780ce44c714a6928098da557539eba150f # v1.20
        if: ${{ !cancelled() }}
        with:
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Go module verify
        if: ${{ !cancelled() }}
        run: go mod download && go mod verify

      # No file carries an OS build constraint, so every leg type-checks the
      # same source and the full analyzer set only needs one OS. go test
      # still runs vet's high-confidence subset on every leg.
      - name: go vet
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: go vet ./...

      - name: Test
        if: ${{ !cancelled() }}
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Coverage floor
        if: ${{ !cancelled() }}
        run: |
          pct="$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')"
          echo "Total coverage: ${pct}%"
          awk -v pct="$pct" 'BEGIN { if (pct + 0 < 75) { print "::error::coverage " pct "% is below the 75% floor"; exit 1 } }'

      - name: Build
        if: ${{ !cancelled() }}
        # No -trimpath: this binary is only dogfooded, and default build
        # flags let it reuse dependency compiles already in the build cache.
        run: go build -o format-dispatch ./cmd/format-dispatch

      # Dogfood --check on this repo's own tree. Only the natively-formatted
      # types (.json, .sh, .go) are actually verified here: the runner has no
      # bunx, sqlfluff, or buf, and --check treats a missing tool as "no
      # opinion" rather than a failure, so this cannot go red over a tool the
      # job never installed. That is the same property that makes --check
      # usable in a consumer's CI without provisioning a toolchain.
      - name: Formatting check
        if: ${{ !cancelled() }}
        run: ./format-dispatch --check .

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ !cancelled() }}

      - uses: Rethunk-Tech/gh-actions/setup-go@79cf1f780ce44c714a6928098da557539eba150f # v1.20
        if: ${{ !cancelled() }}
        with:
          run-lint: "true"
          run-fmt: "true"
          run-govulncheck: "true"

      # Same suite as lefthook pre-push (`gate --list`). The test job still
      # restates the Go checks so Windows exercises them without a gate binary.
      - name: Install gate tools
        if: ${{ !cancelled() }}
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/Rethunk-Tech/rethunk-gate-cli/cmd/gate@v0.6.7

      - name: gate
        if: ${{ !cancelled() }}
        run: gate --tail 400
