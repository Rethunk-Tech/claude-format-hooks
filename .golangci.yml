# https://golangci-lint.run/
version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  default: standard
  enable:
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - nolintlint
    - predeclared
    - revive
    - unconvert
    - wastedassign
  settings:
    nolintlint:
      # A suppression that no longer suppresses anything is a stale decision
      # record; an unexplained one can't be reviewed.
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Test fixtures read/write their own t.TempDir() files — gosec's
      # taint-tracking rules (G304 file inclusion, G306 write perms) don't
      # apply to a test's own throwaway files.
      - path: _test\.go
        linters:
          - gosec
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
